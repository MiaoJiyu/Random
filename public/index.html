<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>随机数生成器</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <!-- 顶部导航 -->
  <header class="topbar glass">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">随机数生成器</span>
      <span class="brand-ver">v2.0</span>
    </div>
    <nav class="nav-tabs">
      <button class="nav-tab active" data-view="draw">🎯 抽取</button>
      <button class="nav-tab" data-view="data">📋 数据</button>
      <button class="nav-tab" data-view="stats">📊 统计</button>
    </nav>
    <div class="cloud-status" id="cloudStatus" title="云端连接状态">
      <span class="dot"></span><span class="txt">连接中…</span>
    </div>
  </header>

  <main class="main">
    <!-- 抽取视图 -->
    <section class="view active" id="view-draw">
      <div class="draw-layout">
        <!-- 左侧浮动配置面板 -->
        <aside class="draw-side glass">
          <h3 class="panel-title">当前配置</h3>
          <div class="now-config" id="drawNowConfig">—</div>

          <h3 class="panel-title">抽取模式</h3>
          <div class="mode-switch">
            <button class="mode-btn active" data-mode="wheel">🎡 大转盘</button>
            <button class="mode-btn" data-mode="number">🔢 数字闪动</button>
          </div>

          <h3 class="panel-title">云端配置</h3>
          <select id="configSelect" class="select"></select>
          <div class="side-actions">
            <button class="btn btn-ghost" id="btnUseCloud">拉取到本地</button>
            <button class="btn btn-ghost" id="btnPushLocal">本地上传云端</button>
          </div>
        </aside>

        <!-- 中央舞台 -->
        <div class="draw-stage">
          <div class="wheel-wrap" id="wheelWrap">
            <canvas id="wheelCanvas" width="460" height="460"></canvas>
            <div class="wheel-pointer"></div>
            <div class="wheel-center" id="wheelCenter">START</div>
          </div>

          <div class="number-wrap hidden" id="numberWrap">
            <div class="number-flash" id="numberFlash">?</div>
          </div>

          <div class="result-bar glass">
            <div class="result-label">本次结果</div>
            <div class="result-value" id="resultValue">—</div>
            <div class="result-weight" id="resultWeight"></div>
          </div>

          <div class="draw-controls">
            <button class="btn btn-primary btn-lg" id="btnDraw">开始抽取</button>
            <button class="btn btn-stop btn-lg hidden" id="btnStop">停止</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 数据视图 -->
    <section class="view" id="view-data">
      <div class="data-stats glass" id="dataStats">
        <div class="stat"><span class="stat-num" id="statCount">0</span><span class="stat-label">总数</span></div>
        <div class="stat"><span class="stat-num" id="statWeight">0</span><span class="stat-label">总权重</span></div>
        <div class="stat"><span class="stat-num" id="statAvg">0%</span><span class="stat-label">平均概率</span></div>
      </div>

      <div class="data-layout">
        <!-- 数字表格 -->
        <div class="data-main glass">
          <div class="table-toolbar">
            <span class="table-title">随机数列表</span>
            <span class="sel-info" id="selInfo">已选 0 项</span>
            <div class="toolbar-actions">
              <button class="btn btn-ghost btn-sm" id="btnDelSel">删除选中</button>
              <button class="btn btn-ghost btn-sm" id="btnWeightSel">权重→选中</button>
              <button class="btn btn-ghost btn-sm" id="btnUniform">统一权重</button>
            </div>
          </div>
          <div class="table-scroll">
            <table class="data-table">
              <thead>
                <tr>
                  <th class="col-check"><input type="checkbox" id="checkAll" /></th>
                  <th>数字</th>
                  <th>权重</th>
                  <th>概率</th>
                </tr>
              </thead>
              <tbody id="dataTbody"></tbody>
            </table>
          </div>
        </div>

        <!-- 控制面板 -->
        <aside class="data-side">
          <div class="side-group glass">
            <h3 class="panel-title">编辑随机数范围</h3>
            <div class="form-row">
              <label>添加单个</label>
              <div class="inline">
                <input type="number" id="inSingle" placeholder="数字" />
                <button class="btn btn-primary btn-sm" id="btnAddSingle">添加</button>
              </div>
            </div>
            <div class="form-row">
              <label>删除单个</label>
              <div class="inline">
                <input type="number" id="inDelSingle" placeholder="数字" />
                <button class="btn btn-ghost btn-sm" id="btnDelSingle">删除</button>
              </div>
            </div>
            <div class="form-row">
              <label>批量区间</label>
              <div class="inline">
                <input type="number" id="inRangeStart" placeholder="起" />
                <span>~</span>
                <input type="number" id="inRangeEnd" placeholder="止" />
                <button class="btn btn-primary btn-sm" id="btnAddRange">添加区间</button>
              </div>
            </div>
            <div class="form-row">
              <label>正则/列表</label>
              <div class="inline">
                <input type="text" id="inRegex" placeholder="如 1-10,15,20-25" />
                <button class="btn btn-primary btn-sm" id="btnAddList">添加</button>
              </div>
            </div>
            <div class="form-row">
              <label>区间删除</label>
              <div class="inline">
                <input type="number" id="inDelStart" placeholder="起" />
                <span>~</span>
                <input type="number" id="inDelEnd" placeholder="止" />
                <button class="btn btn-ghost btn-sm" id="btnDelRange">删除区间</button>
              </div>
            </div>
            <p class="hint">列表/区间支持 <code>1,3,5-9</code> 形式；权重缺失默认 1。</p>
          </div>

          <div class="side-group glass">
            <h3 class="panel-title">编辑权重</h3>
            <div class="form-row">
              <label>单数字权重</label>
              <div class="inline">
                <input type="number" id="inWNum" placeholder="数字" />
                <input type="number" id="inWVal" placeholder="权重" />
                <button class="btn btn-primary btn-sm" id="btnSetWeight">设置</button>
              </div>
            </div>
          </div>

          <div class="side-group glass">
            <h3 class="panel-title">导入 / 导出 / 云端</h3>
            <div class="stack">
              <div class="inline">
                <button class="btn btn-ghost btn-sm" id="btnImportJson">导入JSON</button>
                <button class="btn btn-ghost btn-sm" id="btnExportJson">导出JSON</button>
              </div>
              <div class="inline">
                <button class="btn btn-ghost btn-sm" id="btnImportCsv">导入CSV</button>
                <button class="btn btn-ghost btn-sm" id="btnImportXlsx">导入Excel</button>
                <button class="btn btn-ghost btn-sm" id="btnTpl">下载模板</button>
              </div>
              <div class="inline">
                <button class="btn btn-primary btn-sm" id="btnSaveCloud">保存到云端</button>
                <button class="btn btn-ghost btn-sm" id="btnLoadCloud">从云端拉取</button>
              </div>
              <button class="btn btn-danger btn-sm" id="btnClearAll">清空所有数据</button>
            </div>
            <input type="file" id="fileJson" accept=".json,application/json" hidden />
            <input type="file" id="fileCsv" accept=".csv,text/csv" hidden />
            <input type="file" id="fileXlsx" accept=".xlsx,.xls" hidden />
          </div>

          <div class="side-group glass">
            <h3 class="panel-title">云端配置管理</h3>
            <div class="stack">
              <div class="inline">
                <input type="text" id="inNewName" placeholder="新配置名称" />
                <button class="btn btn-primary btn-sm" id="btnNewConfig">新建</button>
              </div>
              <div id="cloudConfigList" class="cloud-list"></div>
            </div>
          </div>
        </aside>
      </div>
    </section>

    <!-- 统计视图 -->
    <section class="view" id="view-stats">
      <div class="stats-cards">
        <div class="stat-card glass"><span class="sc-num" id="scTotal">0</span><span class="sc-label">抽取总次数</span></div>
        <div class="stat-card glass"><span class="sc-num" id="scLatest">—</span><span class="sc-label">最近一次</span></div>
        <div class="stat-card glass"><span class="sc-num" id="scTop">—</span><span class="sc-label">最高频数字</span></div>
      </div>
      <div class="charts-row">
        <div class="chart-card glass"><div class="chart-title">次数分布（柱状图）</div><div id="barChart" class="chart-box"></div></div>
        <div class="chart-card glass"><div class="chart-title">占比（饼图）</div><div id="pieChart" class="chart-box"></div></div>
      </div>
      <div class="history-card glass">
        <div class="history-head">
          <span class="chart-title">历史记录</span>
          <button class="btn btn-danger btn-sm" id="btnClearHistory">清空历史</button>
        </div>
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th>时间</th><th>数字</th><th>权重</th></tr></thead>
            <tbody id="historyTbody"></tbody>
          </table>
        </div>
        <div class="pager" id="historyPager"></div>
      </div>
    </section>
  </main>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- 模态框（输入权重等） -->
  <div class="modal-mask hidden" id="modalMask">
    <div class="modal glass">
      <div class="modal-title" id="modalTitle">提示</div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost btn-sm" id="modalCancel">取消</button>
        <button class="btn btn-primary btn-sm" id="modalOk">确定</button>
      </div>
    </div>
  </div>

  <!-- 引入本地 vendor（离线可用） -->
  <script src="/vendor/echarts.min.js"></script>
  <script src="/vendor/xlsx.full.min.js"></script>
  <!-- 业务脚本（顺序加载，挂载到全局） -->
  <script src="/js/api.js"></script>
  <script src="/js/random.js"></script>
  <script src="/js/wheel.js"></script>
  <script src="/js/drawView.js"></script>
  <script src="/js/dataView.js"></script>
  <script src="/js/statsView.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
